<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utkeern - Indian Heritage Archive</title>
    <base />
    <script>
        // https://blog.elmah.io/how-to-fix-blazor-wasm-base-path-problems/
        var path = window.location.pathname.split('/');
        var base = document.getElementsByTagName('base')[0];
        if (window.location.host.includes('localhost')) {
            base.setAttribute('href', '/');
        } else if (path.length > 2) {
            base.setAttribute('href', '/' + path[1] + '/');
        } else if (path[path.length - 1].length != 0) {
            window.location.replace(window.location.origin + window.location.pathname + '/' + window.location.search);
        }
    </script>
    
    <!-- Google Fonts: Playfair Display (premium serif for main headings), Lora (serif for body), and Poppins (sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lora:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Blazor component CSS bundle (load first - lower priority) -->
    <link href="BlazorApp.styles.css" rel="stylesheet" />
    
    <!-- Global app CSS (load last - higher priority) -->
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Poppins', sans-serif; color: #5a5550;">
            <div style="text-align: center;">
                <h1 style="font-family: 'Playfair Display', 'Lora', serif; color: #2d1b47; margin-bottom: 10px; font-size: 3.5rem; font-weight: 700; letter-spacing: -0.02em;">Utkeern</h1>
                <p style="margin: 0; font-size: 1.125rem;">Loading heritage archive...</p>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
